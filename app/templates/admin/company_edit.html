{% extends "admin/base.html" %}
{% block page_title %}تعديل {{ company.name }}{% endblock %}
{% block content %}

<form method="POST" class="max-w-2xl">
  <div class="card p-6 space-y-4">
    <div>
      <label class="block text-sm text-ink-200 mb-1">اسم الشركة</label>
      <input type="text" name="name" value="{{ company.name }}" class="input" required>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm text-ink-200 mb-1">العملة الأساسية</label>
        <select name="base_currency" class="select">
          {% for code in ['SAR','EGP','USD','EUR','AED'] %}
          <option value="{{ code }}" {% if company.base_currency==code %}selected{% endif %}>{{ code }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm text-ink-200 mb-1">نسبة الضريبة %</label>
        <input type="number" step="0.01" name="vat_rate" value="{{ company.vat_rate }}" class="input">
      </div>
    </div>
    <div>
      <label class="block text-sm text-ink-200 mb-1">الرقم الضريبي</label>
      <input type="text" name="tax_number" value="{{ company.tax_number or '' }}" class="input">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm text-ink-200 mb-1">الحالة</label>
        <select name="status" class="select">
          {% for s, label in [('ACTIVE','نشطة'),('TRIAL','تجريبية'),('SUSPENDED','موقوفة')] %}
          <option value="{{ s }}" {% if (company.status or 'ACTIVE')==s %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm text-ink-200 mb-1">الباقة</label>
        <select name="plan" class="select">
          {% for p in ['FREE','PRO','ENTERPRISE'] %}
          <option value="{{ p }}" {% if (company.plan or 'FREE')==p %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="flex justify-end gap-2 mt-4">
    <a href="{{ url_for('superadmin.company_detail', company_id=company.id) }}" class="btn btn-secondary">إلغاء</a>
    <button type="submit" class="btn btn-primary">حفظ</button>
  </div>
</form>

{% endblock %}
