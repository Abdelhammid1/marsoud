{% extends "base.html" %}
{% block page_title %}تركيبة جديدة{% endblock %}
{% block content %}
<div class="card p-6">
  <form method="POST" class="space-y-4">
    <h2 class="text-xl font-bold text-navy-900 mb-4">تركيبة منتج جديدة (BOM)</h2>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">اسم التركيبة</label>
        <input type="text" name="name" required class="input">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">المنتج التام</label>
        <select name="product_variant_id" required class="select">
          <option value="">— اختر —</option>
          {% for v in variants %}<option value="{{ v.id }}">{{ v.name or v.sku }} ({{ v.sku }})</option>{% endfor %}
        </select>
      </div>
    </div>

    <div class="border-t border-slate-100 pt-4">
      <h3 class="font-bold text-navy-900 mb-2 text-sm">المكونات (المواد الخام)</h3>
      <p class="text-xs text-slate-500 mb-3">اكتب كل مادة خام والكمية اللازمة لإنتاج وحدة واحدة من المنتج التام.</p>
      <div id="bom-lines" class="space-y-2">
        {% for i in range(5) %}
        <div class="grid grid-cols-[3fr_1fr] gap-2">
          <select name="line_{{ i }}_variant_id" class="select text-sm">
            <option value="">— مكوّن —</option>
            {% for v in variants %}<option value="{{ v.id }}">{{ v.name or v.sku }} ({{ v.sku }})</option>{% endfor %}
          </select>
          <input type="number" step="0.01" min="0" name="line_{{ i }}_qty" placeholder="الكمية/وحدة" class="input text-sm font-mono">
        </div>
        {% endfor %}
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
      <a href="{{ url_for('manufacturing.boms_index') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">💾 حفظ</button>
    </div>
  </form>
</div>
{% endblock %}
