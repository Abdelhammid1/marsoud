{% extends "base.html" %}
{% block page_title %}أمر إنتاج جديد{% endblock %}
{% block content %}
<div class="card p-6">
  <form method="POST" class="space-y-4">
    <h2 class="text-xl font-bold text-navy-900 mb-4">أمر إنتاج جديد</h2>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">التركيبة (BOM)</label>
        <select name="bom_id" required class="select">
          <option value="">— اختر —</option>
          {% for b in boms %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">المخزن</label>
        <select name="warehouse_id" required class="select">
          <option value="">— اختر —</option>
          {% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">الكمية المطلوب إنتاجها</label>
        <input type="number" name="quantity_to_produce" step="0.01" min="0" required class="input font-mono">
      </div>
      <div></div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">أجور مباشرة</label>
        <input type="number" name="direct_labor_cost" step="0.01" min="0" value="0" class="input font-mono">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">مصاريف صناعية</label>
        <input type="number" name="overhead_cost" step="0.01" min="0" value="0" class="input font-mono">
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
      <a href="{{ url_for('manufacturing.work_orders_index') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">💾 إنشاء</button>
    </div>
  </form>
</div>
{% endblock %}
