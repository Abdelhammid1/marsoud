<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الموديول غير متاح — مرصود</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center">
    <div class="text-6xl mb-4">🔧</div>
    <h1 class="text-2xl font-bold text-navy-900 mb-2">هذا القسم متوقف مؤقتاً</h1>
    <p class="text-slate-600 mb-4">
      قسم <span class="font-mono text-emerald-700">{{ module_key }}</span>
      متوقف الآن للصيانة أو معالجة مشكلة تقنية.
    </p>
    {% if reason %}
    <div class="text-sm text-slate-500 mb-6 bg-slate-50 rounded p-3">
      💬 {{ reason }}
    </div>
    {% endif %}
    <p class="text-xs text-slate-400 mb-4">
      سيتم إشعارك فور عودته للعمل. باقي أقسام النظام تعمل بشكل طبيعي.
    </p>
    <a href="/" class="text-sm text-emerald-700 hover:underline">← الرئيسية</a>
  </div>
</body>
</html>
