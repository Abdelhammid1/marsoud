{% extends "base.html" %}
{% block page_title %}{% if lead %}تعديل عميل محتمل{% else %}عميل محتمل جديد{% endif %}{% endblock %}
{% block content %}
<div class="card p-6 max-w-3xl">
  <form method="POST" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">اسم العميل</label>
        <input type="text" name="client_name" required value="{{ lead.client_name if lead else '' }}" class="input">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الهاتف</label>
        <input type="text" name="phone" required dir="ltr" value="{{ lead.phone if lead else '' }}" class="input font-mono">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">البريد الإلكتروني (اختياري)</label>
        <input type="email" name="email" dir="ltr" value="{{ lead.email if lead else '' }}" class="input">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">المسؤول (مندوب المبيعات)</label>
        <select name="assigned_to_id" required class="select">
          {% for r in reps %}
          <option value="{{ r.id }}" {% if lead and lead.assigned_to_id == r.id %}selected{% endif %}>{{ r.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الخدمة المطلوبة</label>
        <input type="text" name="service_needed" required value="{{ lead.service_needed if lead else '' }}" class="input">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">المصدر (اختياري)</label>
        <input type="text" name="source" value="{{ lead.source if lead else '' }}" placeholder="إعلان / إحالة / موقع …" class="input">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">موعد الاجتماع القادم</label>
        <input type="datetime-local" name="next_meeting"
               value="{{ lead.next_meeting.strftime('%Y-%m-%dT%H:%M') if lead and lead.next_meeting else '' }}" class="input">
      </div>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">ملاحظات الاجتماع</label>
      <textarea name="meeting_notes" rows="3" class="textarea">{{ lead.meeting_notes if lead else '' }}</textarea>
    </div>
    <div class="flex justify-end gap-2">
      <a href="{{ url_for('leads.index') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">{% if lead %}حفظ التعديلات{% else %}إنشاء{% endif %}</button>
    </div>
  </form>
</div>
{% endblock %}
