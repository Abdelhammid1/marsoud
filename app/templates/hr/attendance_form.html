{% extends "base.html" %}
{% block page_title %}تسجيل استثناء حضور{% endblock %}
{% block content %}
<div class="card p-6 max-w-2xl">
  <form method="POST" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الموظف</label>
        <select name="employee_id" required class="select">
          <option value="">— اختر موظف —</option>
          {% for e in employees %}
          <option value="{{ e.id }}">{{ e.name }} {% if e.job_title %}— {{ e.job_title }}{% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">التاريخ</label>
        <input type="date" name="date" required value="{{ today }}" class="input">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">النوع</label>
        <select name="type" required class="select" onchange="toggleLate(this)">
          <option value="ABSENT">غياب (يوم كامل)</option>
          <option value="LATE">تأخير (ساعات)</option>
          <option value="UNPAID_LEAVE">إجازة بدون راتب (يوم كامل)</option>
        </select>
        <p class="text-xs text-slate-500 mt-1">"إجازة معتمدة" تنشأ تلقائياً من اعتماد طلب إجازة — لا تُدخل يدوياً.</p>
      </div>
      <div id="late_hours_wrap" style="display:none">
        <label class="block text-sm font-semibold text-slate-700 mb-2">ساعات التأخير</label>
        <input type="number" name="duration_hours" step="0.25" min="0.25" max="8" class="input font-mono" placeholder="مثلاً 2">
        <p class="text-xs text-slate-500 mt-1">يُخصم: ساعات ÷ 8 من يوم العمل.</p>
      </div>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">ملاحظة (اختياري)</label>
      <textarea name="note" rows="2" class="textarea"></textarea>
    </div>
    <div class="flex justify-end gap-2">
      <a href="{{ url_for('hr.attendance') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">تسجيل</button>
    </div>
  </form>
</div>
<script>
function toggleLate(sel) {
  document.getElementById('late_hours_wrap').style.display = sel.value === 'LATE' ? '' : 'none';
}
</script>
{% endblock %}
