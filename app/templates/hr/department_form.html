{% extends "base.html" %}
{% block page_title %}{% if department %}تعديل قسم{% else %}قسم جديد{% endif %}{% endblock %}
{% block content %}
<div class="card p-6 max-w-2xl">
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">اسم القسم</label>
      <input type="text" name="name" required value="{{ department.name if department else '' }}" class="input">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">الوصف</label>
      <textarea name="description" rows="2" class="textarea">{{ department.description if department else '' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">المدير المسؤول (اختياري)</label>
      <select name="manager_employee_id" class="select">
        <option value="">— لا يوجد —</option>
        {% for e in employees %}
        <option value="{{ e.id }}" {% if department and department.manager_employee_id == e.id %}selected{% endif %}>{{ e.name }} {% if e.job_title %}— {{ e.job_title }}{% endif %}</option>
        {% endfor %}
      </select>
    </div>
    {% if department %}
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" name="is_active" value="1" {% if department.is_active %}checked{% endif %} class="w-4 h-4">
      <span>القسم نشط</span>
    </label>
    {% endif %}
    <div class="flex justify-end gap-2">
      <a href="{{ url_for('hr.departments') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">{% if department %}حفظ التعديلات{% else %}إنشاء{% endif %}</button>
    </div>
  </form>
</div>
{% endblock %}
