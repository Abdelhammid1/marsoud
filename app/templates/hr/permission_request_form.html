{% extends "base.html" %}
{% block page_title %}طلب استئذان جديد{% endblock %}
{% block content %}
<div class="mb-5">
  <h2 class="font-bold text-navy-900 text-lg">🕐 طلب استئذان جديد</h2>
  <p class="text-sm text-slate-500 mt-1">
    ساعات الاستئذان تُخصم من تأخير اليوم قبل تطبيق السماح اليومي والرصيد الشهري.
  </p>
</div>

<form method="POST" class="card p-6 max-w-2xl space-y-4">

  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1">الموظف</label>
    <select name="employee_id" class="input" required>
      <option value="">— اختر —</option>
      {% for e in employees %}
      <option value="{{ e.id }}">{{ e.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1">اليوم</label>
    <input type="date" name="request_date" class="input" dir="ltr"
           value="{{ today }}" required>
  </div>

  <div class="grid grid-cols-3 gap-3">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">من</label>
      <input type="time" name="start_time" class="input" dir="ltr">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">إلى</label>
      <input type="time" name="end_time" class="input" dir="ltr">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">عدد الساعات</label>
      <input type="number" step="0.25" min="0.25" name="hours_count" class="input" dir="ltr" required>
    </div>
  </div>

  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1">السبب</label>
    <textarea name="reason" class="input" rows="3"></textarea>
  </div>

  <div class="flex gap-2 pt-2">
    <button class="btn-primary text-sm">إرسال</button>
    <a href="{{ url_for('hr.permission_requests') }}" class="text-sm text-slate-500 self-center">إلغاء</a>
  </div>
</form>

{% endblock %}
