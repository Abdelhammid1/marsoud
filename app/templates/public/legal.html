<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>{{ title }} — مرصود</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 antialiased">
<div class="max-w-3xl mx-auto px-4 py-10">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
    <div class="flex items-baseline justify-between mb-6 pb-4 border-b border-slate-100">
      <h1 class="text-2xl font-bold text-navy-900">{{ title }}</h1>
      <span class="text-xs text-slate-400 font-mono">إصدار {{ version }}</span>
    </div>
    <div class="prose prose-sm max-w-none text-slate-700 leading-relaxed">
      {{ content }}
    </div>
    <div class="mt-8 pt-4 border-t border-slate-100 text-sm text-slate-400">
      <a href="/" class="hover:text-emerald-700">← الرئيسية</a>
    </div>
  </div>
</div>
</body>
</html>
