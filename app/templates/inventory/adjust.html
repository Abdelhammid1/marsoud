{% extends "base.html" %}
{% block page_title %}تسوية جرد{% endblock %}
{% block content %}
<div class="card p-6 max-w-xl">
  <h2 class="font-bold text-navy-900 mb-2">تسوية جرد</h2>
  <p class="text-xs text-slate-500 mb-4">
    يضبط الكمية الفعلية على الرف للرقم الصحيح. الفرق يُكتب لحساب «فروقات الجرد» (5990).
  </p>
  <form method="POST" class="space-y-3">
    <div>
      <label class="block text-sm font-semibold mb-1">الصنف</label>
      <select name="variant_id" required class="select">
        <option value="">— اختر —</option>
        {% for v in variants %}<option value="{{ v.id }}">{{ v.sku }} — {{ v.display_name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">المخزن</label>
      <select name="warehouse_id" required class="select">
        {% for w in warehouses %}<option value="{{ w.id }}" {% if w.is_default %}selected{% endif %}>{{ w.code }} — {{ w.name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">الكمية الفعلية الجديدة</label>
      <input type="number" step="0.01" name="new_qty" required class="input">
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">السبب <span class="text-rose-500">*</span></label>
      <textarea name="reason" rows="2" required class="textarea" placeholder="مثال: تالف، مفقود من رف، عدّ جرد سنوي…"></textarea>
    </div>
    <div class="flex justify-end gap-2">
      <a href="{{ url_for('inventory.index') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">حفظ التسوية</button>
    </div>
  </form>
</div>
{% endblock %}
