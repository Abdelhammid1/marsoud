{% extends "base.html" %}
{% block page_title %}تحويل جديد{% endblock %}
{% block content %}

<div class="card p-6 max-w-3xl">
  <h2 class="font-bold text-navy-900 mb-3">🔁 تحويل بين مخازن</h2>
  <form method="POST" id="tr-form" class="space-y-4">
    <input type="hidden" name="items_json" id="items-json" value="[]">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold mb-1">من مخزن</label>
        <select name="from_warehouse_id" required class="select">
          {% for w in warehouses %}<option value="{{ w.id }}" {% if w.is_default %}selected{% endif %}>{{ w.code }} — {{ w.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">إلى مخزن</label>
        <select name="to_warehouse_id" required class="select">
          {% for w in warehouses %}<option value="{{ w.id }}">{{ w.code }} — {{ w.name }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-semibold mb-2">البنود</label>
      <div class="flex items-center gap-2 mb-2">
        <select id="variant-picker" class="select text-sm flex-1">
          <option value="">— اختر صنف —</option>
          {% for v in variants %}<option value="{{ v.id }}" data-name="{{ v.display_name }}" data-sku="{{ v.sku }}">{{ v.sku }} — {{ v.display_name }}</option>{% endfor %}
        </select>
        <input type="number" id="qty-input" min="0.001" step="0.001" class="input text-sm w-24" placeholder="الكمية">
        <button type="button" onclick="addItem()" class="btn-secondary text-sm">+ إضافة</button>
      </div>
      <div id="items-list" class="space-y-1 text-sm"></div>
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">ملاحظات</label>
      <textarea name="notes" rows="2" class="textarea text-sm"></textarea>
    </div>

    <div class="flex justify-end gap-2">
      <a href="{{ url_for('inventory.transfers') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">حفظ كمسودة</button>
    </div>
  </form>
</div>

<script>
let items = [];
function renderItems() {
  const wrap = document.getElementById('items-list');
  if (items.length === 0) {
    wrap.innerHTML = '<div class="text-xs text-slate-500">لم تُضَف بنود بعد.</div>';
  } else {
    wrap.innerHTML = items.map((r, i) => `
      <div class="flex items-center justify-between bg-slate-50 rounded p-2">
        <span><strong class="font-mono">${r.sku}</strong> · ${escapeHtml(r.name)} · <span class="font-mono">${r.qty}</span></span>
        <button type="button" onclick="rmItem(${i})" class="text-xs text-rose-600 hover:underline">حذف</button>
      </div>
    `).join('');
  }
  document.getElementById('items-json').value = JSON.stringify(items.map(i => ({variant_id: i.variant_id, qty: i.qty})));
}
function addItem() {
  const sel = document.getElementById('variant-picker');
  const qty = parseFloat(document.getElementById('qty-input').value || 0);
  if (!sel.value || qty <= 0) { alert('اختر صنف وكمية صحيحة'); return; }
  const opt = sel.options[sel.selectedIndex];
  items.push({variant_id: parseInt(sel.value), sku: opt.dataset.sku, name: opt.dataset.name, qty: qty});
  sel.value = ''; document.getElementById('qty-input').value = '';
  renderItems();
}
function rmItem(i) { items.splice(i, 1); renderItems(); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
renderItems();
</script>
{% endblock %}
