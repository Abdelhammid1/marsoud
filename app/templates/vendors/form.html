{% extends "base.html" %}
{% block page_title %}{% if vendor %}تعديل المورد: {{ vendor.name }}{% else %}مورد جديد{% endif %}{% endblock %}
{% block content %}
<div class="card p-6 max-w-2xl">
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">الاسم</label>
      <input type="text" name="name" required value="{{ vendor.name if vendor else '' }}" class="input">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">البريد الإلكتروني</label>
        <input type="email" name="email" dir="ltr" value="{{ vendor.email if vendor else '' }}" class="input">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الهاتف</label>
        <input type="text" name="phone" dir="ltr" value="{{ vendor.phone if vendor else '' }}" class="input">
      </div>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">الحساب البنكي</label>
      <input type="text" name="bank_account" dir="ltr" value="{{ vendor.bank_account if vendor else '' }}" class="input">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">العنوان</label>
      <textarea name="address" rows="2" class="textarea">{{ vendor.address if vendor else '' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">الرقم الضريبي</label>
      <input type="text" name="tax_number" value="{{ vendor.tax_number if vendor else '' }}" class="input">
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <a href="{{ url_for('vendors.index') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">{% if vendor %}حفظ التعديلات{% else %}إضافة{% endif %}</button>
    </div>
  </form>
</div>
{% endblock %}
