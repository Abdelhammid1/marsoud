{% extends "base.html" %}
{% block page_title %}إعادة تعيين كلمة السر{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card p-8">
  <h2 class="text-xl font-bold text-navy-900 mb-2">🔐 كلمة سر جديدة</h2>
  <p class="text-sm text-slate-500 mb-6">
    اكتب كلمة السر الجديدة مرتين. الحد الأدنى 8 حروف مع حرف ورقم على الأقل.
  </p>
  <form method="POST" class="space-y-3">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">كلمة السر الجديدة</label>
      <input type="password" name="password" required minlength="8"
             class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">تأكيد كلمة السر</label>
      <input type="password" name="confirm" required minlength="8"
             class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100">
    </div>
    <button type="submit" class="btn-primary w-full">💾 حفظ كلمة السر</button>
  </form>
</div>
{% endblock %}
