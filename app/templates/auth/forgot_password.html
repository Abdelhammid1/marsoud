{% extends "base.html" %}
{% block page_title %}نسيت كلمة السر{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card p-8">
  <h2 class="text-xl font-bold text-navy-900 mb-2">🔑 نسيت كلمة السر؟</h2>
  <p class="text-sm text-slate-500 mb-6">
    ادخل الإيميل المسجّل عندك، هنبعتلك رابط لإعادة التعيين.
    الرابط بيكون صالح لمدة ساعة.
  </p>
  <form method="POST" class="space-y-3">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">الإيميل</label>
      <input type="email" name="email" required dir="ltr"
             class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100">
    </div>
    <button type="submit" class="btn-primary w-full">إرسال الرابط</button>
  </form>
  <div class="mt-5 text-center text-sm">
    <a href="{{ url_for('auth.login') }}" class="text-emerald-700 hover:underline">← رجوع لصفحة الدخول</a>
  </div>
</div>
{% endblock %}
