{% extends "base.html" %}
{% block page_title %}عهدة نقدية جديدة{% endblock %}
{% block content %}
<div class="card p-6 max-w-2xl">
  <h2 class="font-bold text-navy-900 mb-4">صرف عهدة نقدية جديدة</h2>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">نوع الحامل</label>
      <div class="flex gap-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="holder_type" value="EMPLOYEE" checked
                 onchange="_toggleHolder('EMPLOYEE')">
          <span>موظف</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="holder_type" value="DEPARTMENT"
                 onchange="_toggleHolder('DEPARTMENT')">
          <span>قسم</span>
        </label>
      </div>
    </div>

    <div id="employee-row">
      <label class="block text-sm font-semibold text-slate-700 mb-2">الموظف</label>
      <select name="employee_id" class="select">
        <option value="">— اختر موظف —</option>
        {% for e in employees %}
        <option value="{{ e.id }}">{{ e.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div id="department-row" style="display:none">
      <label class="block text-sm font-semibold text-slate-700 mb-2">القسم</label>
      <select name="department_id" class="select">
        <option value="">— اختر قسم —</option>
        {% for d in departments %}
        <option value="{{ d.id }}">{{ d.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">المبلغ</label>
        <input type="number" name="amount" step="0.01" min="0.01" required
               class="input">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">طريقة الصرف</label>
        <select name="payment_method_id" class="select">
          <option value="">نقدي (1110)</option>
          {% for pm in payment_methods %}
          <option value="{{ pm.id }}">{{ pm.name_ar or pm.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">الغرض</label>
      <textarea name="purpose" rows="2" required class="textarea"
                placeholder="مثلاً: مصاريف انتقال للفرع الجديد"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">تاريخ الصرف</label>
        <input type="date" name="issued_on" value="{{ today }}" required class="input">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">موعد التسوية (اختياري)</label>
        <input type="date" name="settlement_due_date" class="input">
      </div>
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">ملاحظات</label>
      <textarea name="note" rows="2" class="textarea"></textarea>
    </div>

    <div class="flex justify-end gap-2">
      <a href="{{ url_for('custody.index') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">صرف العهدة</button>
    </div>
  </form>
</div>
<script>
function _toggleHolder(kind) {
  document.getElementById('employee-row').style.display =
    kind === 'EMPLOYEE' ? '' : 'none';
  document.getElementById('department-row').style.display =
    kind === 'DEPARTMENT' ? '' : 'none';
}
</script>
{% endblock %}
