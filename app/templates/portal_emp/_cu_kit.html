{# MARSOUD-CUSTODY-PORTAL-P90 — shared style + helpers for the 4 employee
   custody pages (custody_list / custody_detail / items_list / items_detail).
   Everything is scoped under .cu so nothing else on the site is touched. #}
<style>
.cu{--em:#059669;--em-d:#047857;--em-bg:#ecfdf5;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--amb:#b45309;--amb-bg:#fffbeb;--rose:#be123c;--rose-bg:#fff1f2;--sky:#0369a1;--sky-bg:#f0f9ff;max-width:1000px;margin:0 auto;color:var(--ink)}
.cu *{box-sizing:border-box}
.cu-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cu-title{font-size:22px;font-weight:800;margin:0}
.cu-sub{font-size:13px;color:var(--mut);margin-top:2px}
.cu-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.cu-h{font-size:16px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cu-h small{font-weight:400;color:var(--mut);font-size:12px}
.cu-grid{display:grid;gap:12px}
.cu-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cu-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cu-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cu-kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}
.cu-kpi.em{background:var(--em-bg);border-color:#a7f3d0}
.cu-kpi.am{background:var(--amb-bg);border-color:#fde68a}
.cu-kpi.sk{background:var(--sky-bg);border-color:#bae6fd}
.cu-kpi.rs{background:var(--rose-bg);border-color:#fecdd3}
.cu-kpi-l{font-size:12px;color:var(--mut)}
.cu-kpi-v{font-size:22px;font-weight:800;margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:start}
.cu-kpi-s{font-size:11px;color:var(--mut);margin-top:2px}
.cu-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--em);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none}
.cu-btn:hover{background:var(--em-d)}
.cu-btn[disabled]{opacity:.5;cursor:not-allowed}
.cu-btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.cu-btn.sec:hover{background:var(--soft)}
.cu-btn.block{width:100%}
.cu-alert{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;background:var(--amb-bg);border:1px solid #fde68a;color:#92400e}
.cu-alert.bad{background:var(--rose-bg);border-color:#fecdd3;color:var(--rose)}
.cu-det{border:1px solid #a7f3d0;background:var(--em-bg);border-radius:14px;padding:4px 14px;margin-bottom:14px}
.cu-det>summary{cursor:pointer;font-weight:800;color:var(--em-d);padding:12px 0;font-size:15px}
.cu-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:6px 0 14px}
.cu-form .full{grid-column:1/-1}
.cu-lbl{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:4px}
.cu-in{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.cu-in:focus{outline:2px solid #6ee7b7;border-color:var(--em)}
.cu-hint{font-size:12px;color:var(--mut);margin-top:4px}
.cu-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cu-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;color:#475569;font-family:inherit}
.cu-chip:hover{border-color:var(--em);color:var(--em-d)}
.cu-filt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.cu-fb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#475569;font-family:inherit}
.cu-fb.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.cu-list{display:flex;flex-direction:column;gap:10px}
.cu-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.cu-item.over{border-color:#fecdd3;background:#fffafb}
.cu-item-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cu-item-t{font-weight:800;font-size:15px}
.cu-item-s{font-size:12px;color:var(--mut);margin-top:2px}
.cu-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.cu-num{font-size:12px;color:var(--mut)}
.cu-num b{display:block;font-size:15px;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:start}
.cu-bar{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:10px 0 2px}
.cu-bar>i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#059669);border-radius:999px}
.cu-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.cu-link{color:var(--em-d);font-weight:700;font-size:13px;text-decoration:none}
.cu-link:hover{text-decoration:underline}
.cu-b{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.cu-b.p{background:var(--amb-bg);color:var(--amb)}
.cu-b.a{background:var(--em-bg);color:var(--em-d)}
.cu-b.r{background:var(--rose-bg);color:var(--rose)}
.cu-b.s{background:var(--sky-bg);color:var(--sky)}
.cu-b.o{background:#f1f5f9;color:#475569}
.cu-empty{text-align:center;color:var(--mut);font-size:14px;padding:22px 10px;border:1px dashed var(--line);border-radius:12px}
.cu-doc{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--em-d);text-decoration:none;background:var(--em-bg);border-radius:8px;padding:2px 8px;margin:4px 4px 0 0}
.cu-doc:hover{text-decoration:underline}
.cu-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.cu-f-l{font-size:12px;color:var(--mut)}
.cu-f-v{font-weight:700;font-size:14px;word-break:break-word}
.cu-f-v.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.cu-pick-top{display:flex;gap:8px;margin-bottom:8px}
.cu-pick-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.cu-pick{position:relative;display:block;cursor:pointer}
.cu-pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.cu-pick-b{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.cu-pick-b small{color:var(--mut);font-size:12px}
.cu-pick:hover .cu-pick-b{border-color:var(--em)}
.cu-pick.is-on .cu-pick-b{border-color:var(--em);background:var(--em-bg);box-shadow:0 0 0 2px #a7f3d0}
.cu-steps{display:flex;gap:0;margin:6px 0 2px}
.cu-step{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative;padding-top:20px}
.cu-step:before{content:"";position:absolute;top:4px;inset-inline:0;height:4px;background:#e2e8f0}
.cu-step:after{content:"";position:absolute;top:0;inset-inline-start:50%;width:12px;height:12px;margin-inline-start:-6px;border-radius:50%;background:#cbd5e1}
.cu-step.on{color:var(--em-d);font-weight:700}
.cu-step.on:before{background:var(--em)}
.cu-step.on:after{background:var(--em)}
.cu-line{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cu-line-m{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;direction:ltr}
@media (max-width:820px){.cu-g4{grid-template-columns:repeat(2,minmax(0,1fr))}.cu-g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){
 .cu-title{font-size:19px}
 .cu-card{padding:14px}
 .cu-form{grid-template-columns:minmax(0,1fr)}
 .cu-nums{grid-template-columns:repeat(3,minmax(0,1fr))}
 .cu-num b{font-size:13px}
 .cu-pick-list{grid-template-columns:minmax(0,1fr)}
 .cu-kpi-v{font-size:19px}
 .cu-g3{grid-template-columns:minmax(0,1fr)}
}
@media print{.cu-btn,.cu-det,.cu-filt{display:none!important}}
</style>
<script>
(function () {
  function init() {
  function $$(s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
  /* status filter chips:  <div data-cu-filter="listId"> ... [data-f] */
  $$('[data-cu-filter]').forEach(function (bar) {
    var id = bar.getAttribute('data-cu-filter');
    var list = document.getElementById(id), empty = document.getElementById(id + '-empty');
    $$('.cu-fb', bar).forEach(function (b) {
      b.addEventListener('click', function () {
        $$('.cu-fb', bar).forEach(function (x) { x.classList.toggle('is-on', x === b); });
        var f = b.getAttribute('data-f'), n = 0;
        $$('[data-st]', list).forEach(function (r) {
          var vis = f === 'all' || r.getAttribute('data-st') === f;
          r.style.display = vis ? '' : 'none'; if (vis) { n++; }
        });
        if (empty) { empty.style.display = n ? 'none' : ''; }
      });
    });
  });
  /* chips that fill an input:  <button data-fill="inputId" data-value="..."> */
  $$('[data-fill]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = document.getElementById(b.getAttribute('data-fill'));
      if (!i) { return; }
      i.value = b.getAttribute('data-value'); i.focus();
      try { i.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {}
    });
  });
  /* chips that set a date N days from today:  <button data-days="3" data-for="inputId"> */
  $$('[data-days]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = document.getElementById(b.getAttribute('data-for')); if (!i) { return; }
      var d = new Date(); d.setDate(d.getDate() + parseInt(b.getAttribute('data-days'), 10));
      var m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
      i.value = d.getFullYear() + '-' + m + '-' + day;
    });
  });
  /* selectable item cards + search */
  $$('.cu-pick input').forEach(function (r) {
    r.addEventListener('change', function () {
      $$('.cu-pick').forEach(function (p) { p.classList.toggle('is-on', p.querySelector('input').checked); });
    });
  });
  function norm(t) {
    return String(t || '').toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[\u0623\u0625\u0622]/g, '\u0627')
      .replace(/\u0629/g, '\u0647').replace(/\u0649/g, '\u064A').trim();
  }
  $$('[data-cu-search]').forEach(function (s) {
    var id = s.getAttribute('data-cu-search');
    var list = document.getElementById(id), none = document.getElementById(id + '-none');
    s.addEventListener('input', function () {
      var q = norm(s.value), n = 0;
      $$('.cu-pick', list).forEach(function (p) {
        var vis = !q || norm(p.getAttribute('data-q')).indexOf(q) !== -1;
        p.style.display = vis ? '' : 'none'; if (vis) { n++; }
      });
      if (none) { none.style.display = n ? 'none' : ''; }
    });
  });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
