{% extends "base.html" %}
{% block page_title %}{% if task %}تعديل مهمة{% else %}مهمة جديدة{% endif %}{% endblock %}
{% block content %}
<div class="card p-6 max-w-3xl">
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">العنوان</label>
      <input type="text" name="title" required value="{{ task.title if task else '' }}" class="input">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">الوصف</label>
      <textarea name="description" rows="3" class="textarea">{{ task.description if task else '' }}</textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">المشروع (اختياري)</label>
        <select name="project_id" class="select" {% if task %}disabled{% endif %}>
          <option value="">— بدون مشروع (مهمة مستقلة) —</option>
          {% for p in projects %}
          <option value="{{ p.id }}" {% if (task and task.project_id == p.id) or (selected_project and selected_project == p.id|string) %}selected{% endif %}>{{ p.name }}</option>
          {% endfor %}
        </select>
        {% if task %}<input type="hidden" name="project_id" value="{{ task.project_id or '' }}">{% endif %}
        <p class="text-xs text-slate-500 mt-1">يمكنك إنشاء مهمة بدون مشروع لمتابعة شخصية أو عمل لا يتبع لخطة محددة.</p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">المُعيَّن إليه</label>
        <select name="assigned_to_id" required class="select">
          {% for u in users %}{% if u %}<option value="{{ u.id }}" {% if task and task.assigned_to_id == u.id %}selected{% endif %}>{{ u.full_name }}</option>{% endif %}{% endfor %}
        </select>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الأولوية</label>
        <select name="priority" required class="select">
          {% for p in priorities %}<option value="{{ p.name }}" {% if task and task.priority == p %}selected{% endif %}>{{ p.label_ar }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">المرحلة (اختياري)</label>
        <select name="milestone_id" class="select">
          <option value="">— بدون —</option>
          {% for m in milestones %}<option value="{{ m.id }}" {% if task and task.milestone_id == m.id %}selected{% endif %}>{{ m.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Deadline</label>
        <input type="date" name="deadline" value="{{ task.deadline.isoformat() if task and task.deadline else '' }}" class="input">
      </div>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">ملاحظات</label>
      <textarea name="notes" rows="2" class="textarea">{{ task.notes if task else '' }}</textarea>
    </div>
    <div class="flex justify-end gap-2">
      <a href="{{ url_for('tasks.index') }}" class="btn-secondary">إلغاء</a>
      <button type="submit" class="btn-primary">{% if task %}حفظ التعديلات{% else %}إنشاء{% endif %}</button>
    </div>
  </form>
</div>
{% endblock %}
