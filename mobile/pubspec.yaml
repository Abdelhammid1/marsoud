name: marsoud
description: "Marsoud — mobile app for employees, HR, and sales."
publish_to: 'none'
# MARSOUD-MOBILE-VERSION-BUMP (2026-09-16) — Apple rejected the
# 1.0.3 build (train ID 6811166755, build 12) with ITMS-90186
# "Invalid Pre-Release Train" + ITMS-90062 "This bundle is invalid".
# Once a marketing version is approved or has a closed pre-release
# train, the same X.Y.Z can never be submitted again. Bumped to
# 1.0.4 for the next TestFlight submission; build number jumps to
# +13 so it stays strictly higher than the last upload (12) —
# Apple rejects any build whose CFBundleVersion is <= a previously
# uploaded build within the same marketing version.
version: 1.0.4+13

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Secure storage (bearer token)
  flutter_secure_storage: ^9.2.2

  # Non-secret prefs (active company id)
  shared_preferences: ^2.3.3

  # Formatting + locale
  intl: ^0.20.2

  # Fonts — Cairo, same as the web
  google_fonts: ^6.2.1

  # GPS for attendance
  geolocator: ^13.0.2

  # MARSOUD-MOBILE-SHIP-READY-01 (M1) — the following four
  # dependencies were declared but never imported. Removed until
  # the screens that need them ship (file uploads, PDF payslip
  # preview). Re-add per-feature when actually wired.
  #   image_picker: ^1.1.2
  #   file_picker: ^8.1.4
  #   permission_handler: ^11.3.1
  #   syncfusion_flutter_pdfviewer: ^28.2.7   (large, licensed)

  # MARSOUD-MOBILE-TKT-05 (2026-08-18) — Firebase Cloud Messaging
  # for push notifications. `firebase_core` is a hard prereq for
  # every other firebase package. `flutter_local_notifications`
  # is what actually pops the tray notification while the app is
  # foregrounded on Android (FCM only auto-displays a
  # foreground notification on iOS by default).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # MARSOUD-ACCOUNT-DELETION-01 (2026-09-11) — used to open the web
  # privacy policy + delete-account URLs in the OS browser from
  # Settings.  Apple App Store guideline 5.1.1(v) requires an in-app
  # path to delete one's account; launching the mobile-friendly web
  # page satisfies it (Apple accepts a WebView / external browser
  # handoff so long as the deletion actually works).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # MARSOUD-MOBILE-BRAND-LOGO-01 (2026-09-03) — copied from
  # app/static/img/logo.png so the sidebar + login screen render
  # the real Marsoud mark instead of the emerald "م" placeholder.
  assets:
    - assets/images/logo.png
